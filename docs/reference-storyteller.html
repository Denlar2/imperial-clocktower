<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clocktower Storyteller</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--night:#1d1b2e;--dusk:#2b2841;--candle:#e6b64a;--wax:#f3e9d2;--good:#7fb2e5;--evil:#d9534f;--dim:#9a93b5;--line:#3d3958}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--night);color:var(--wax);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;margin:0}
  h1{font-size:1.9rem}h2{font-size:1.35rem;color:var(--candle)}
  header{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
  header select{font-family:"IM Fell English",serif;font-size:1rem;max-width:55%}
  main{padding:14px 14px 90px;max-width:560px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--dusk);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--dim);font:inherit;padding:14px 0;font-family:"IM Fell English",serif;font-size:1.05rem}
  nav button.on{color:var(--candle);border-top:2px solid var(--candle);margin-top:-1px}
  .panel{display:none}.panel.on{display:block}
  button.btn,select,input[type=text]{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--dusk);color:var(--wax);padding:9px 12px}
  input[type=text]{width:100%}
  button.btn{cursor:pointer}
  button.btn.primary{background:var(--candle);color:var(--night);border-color:var(--candle);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>*{flex:1}
  .comp{color:var(--dim);margin:6px 0 14px}.comp b{color:var(--wax)}
  .card{background:var(--dusk);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .card.dead{opacity:.55}.card.dead .name{text-decoration:line-through}
  .card.warn{border-color:var(--evil)}
  .name{font-family:"IM Fell English",serif;font-size:1.3rem}
  .role{font-size:.95rem;color:var(--dim)}.role.good{color:var(--good)}.role.evil{color:var(--evil)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.85rem;background:none;color:var(--dim);font:inherit}
  .chip.on{background:var(--candle);color:var(--night);border-color:var(--candle)}
  .chip.on.bad{background:var(--evil);border-color:var(--evil);color:#fff}
  .note{margin-top:8px}
  .stat{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.stat span{color:var(--dim)}
  .step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .step input[type=checkbox]{margin-top:5px;width:20px;height:20px;accent-color:var(--candle);flex:0 0 auto}
  .step>div{flex:1}
  .step.done{opacity:.4}.step .who{color:var(--candle)}.step .hint{color:var(--dim);font-size:.9rem}
  .step select{margin-top:6px;width:100%}
  .step.absent{display:none}.toggleAbsent .step.absent{display:flex;opacity:.35}
  .revealList button{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;font-size:1.1rem}
  #curtain{position:fixed;inset:0;background:var(--night);display:none;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;z-index:9}
  #curtain.on{display:flex}
  #curtain .name{font-size:1.2rem;color:var(--dim)}
  #curtain .big{font-family:"IM Fell English",serif;font-size:2.6rem;margin:10px 0 4px}
  #curtain .team{margin-bottom:14px}#curtain .abil{max-width:34ch}
  #curtain .mates{color:var(--evil);margin-top:14px;max-width:34ch}#curtain .btn{margin-top:28px}
  .empty{color:var(--dim);text-align:center;padding:40px 10px}
  label{color:var(--dim);font-size:.9rem}
  .sheet .role{margin:2px 0 10px}
  .sheet h3{color:var(--candle);margin:16px 0 6px;font-size:1.15rem}
  @media (prefers-reduced-motion:no-preference){#curtain.on{animation:fade .18s ease}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<header><h1>Clocktower</h1><select id="script" onchange="setScript(this.value)"><option value="TB">Trouble Brewing</option><option value="BMR">Bad Moon Rising</option><option value="UTT">Unholier Than Thou</option></select></header>
<main>

<section id="setup" class="panel on">
  <h2>Setup</h2>
  <div class="row"><label style="flex:0 0 auto">Players</label><select id="count"></select></div>
  <div class="comp" id="comp"></div>
  <div id="names"></div>
  <div class="row"><button class="btn" onclick="randomise()">Deal random roles</button><button class="btn primary" onclick="startGame()">Start game</button></div>
  <div class="sheet" id="sheet"></div>
</section>

<section id="grim" class="panel">
  <div class="stat"><h2>Grimoire</h2><span id="phase"></span></div>
  <div class="row"><button class="btn" onclick="nextPhase()" id="phaseBtn">Begin first night</button></div>
  <div class="stat"><span id="counts"></span></div>
  <div id="tracker"></div>
  <div id="grimList"></div>
  <div class="card" id="notInPlay"></div>
</section>

<section id="night" class="panel">
  <div class="stat"><h2 id="nightTitle">Night order</h2><label><input type="checkbox" id="showAbsent" onchange="renderNight()"> show all</label></div>
  <div id="nightList"></div>
  <div class="row"><button class="btn primary" id="dawnBtn" onclick="nextPhase()">Dawn — start the day</button></div>
  <div class="card" id="jinx"></div>
</section>

<section id="reveal" class="panel">
  <h2>Reveal roles</h2>
  <p class="comp">Hand the phone to each player. They tap their name, read, then tap to hide.</p>
  <div class="revealList" id="revealList"></div>
</section>
</main>

<nav>
  <button class="on" onclick="tab('setup')">Setup</button>
  <button onclick="tab('grim')">Grimoire</button>
  <button onclick="tab('night')">Night</button>
  <button onclick="tab('reveal')">Reveal</button>
</nav>

<div id="curtain" onclick="hideCard()">
  <div class="name" id="cName"></div><div class="big" id="cRole"></div><div class="team" id="cTeam"></div>
  <div class="abil" id="cAbil"></div><div class="mates" id="cMates"></div>
  <button class="btn">Hide and pass on</button>
</div>

<script>
// Ability text is a short plain-words reminder, not the official card text.
// t=type  a=ability  n1=first night prompt  n=other nights prompt
// fake='Townsfolk'|'Demon'|'Good' = this character is shown a different role
// pick=true = night step has a target picker that sets a mark on the chosen player
const shared={
  Chef:{t:'Townsfolk',a:'Starts knowing how many pairs of evil players sit next to each other.',n1:'Show the number of adjacent evil pairs.'},
  Librarian:{t:'Townsfolk',a:'Starts knowing that one of two players is a particular Outsider, or that there are none.',n1:'Show an Outsider token and point to two players, or show a 0.'},
  Lunatic:{t:'Outsider',fake:'Demon',a:'Thinks they are a Demon, but are not. The real Demon knows who the Lunatic is and who they try to kill.',n1:'Wake the Lunatic as a Demon; show fake Minions and 3 bluffs. Then wake the Demon and point out the Lunatic.',n:'Wake the Lunatic as the Demon and let them "act". Nobody dies. Tell the real Demon who was chosen.'},
  Poisoner:{t:'Minion',pick:'poison',a:'Each night, poisons one player until the next dusk.',n1:'They pick a player. Mark poisoned.',n:'They pick a player. Mark poisoned.'},
};
const SCRIPTS={
TB:{name:'Trouble Brewing',chars:{
  Washerwoman:{t:'Townsfolk',a:'Starts knowing that one of two players is a particular Townsfolk.',n1:'Show a Townsfolk token and point to two players (one really is that character).'},
  Librarian:shared.Librarian,
  Investigator:{t:'Townsfolk',a:'Starts knowing that one of two players is a particular Minion.',n1:'Show a Minion token and point to two players.'},
  Chef:shared.Chef,
  Empath:{t:'Townsfolk',a:'Each night, learns how many of their two living neighbours are evil.',n1:'Show 0, 1 or 2.',n:'Show 0, 1 or 2 for living neighbours.'},
  'Fortune Teller':{t:'Townsfolk',a:'Each night, picks two players and learns if one of them is the Demon. One good player also reads as the Demon (the red herring).',n1:'They pick two. Yes if either is the Demon or the red herring.',n:'They pick two. Yes or no.'},
  Undertaker:{t:'Townsfolk',a:'Each night, learns which character was executed that day.',n:'Show the executed character, if any.'},
  Monk:{t:'Townsfolk',pick:'safe',a:'Each night, protects one other player from the Demon.',n:'They pick a player. Mark them safe.'},
  Ravenkeeper:{t:'Townsfolk',a:'If killed at night, wakes and learns one chosen player\'s character.',n:'Only if they died tonight: they pick a player, show that character.'},
  Virgin:{t:'Townsfolk',a:'The first time they are nominated, if the nominator is a Townsfolk, the nominator is executed immediately.'},
  Slayer:{t:'Townsfolk',a:'Once per game, during the day, may publicly pick a player. If it is the Demon, it dies.'},
  Soldier:{t:'Townsfolk',a:'Cannot be killed by the Demon.'},
  Mayor:{t:'Townsfolk',a:'If only three players are alive and nobody is executed, good wins. If the Demon attacks them, someone else may die instead.'},
  Butler:{t:'Outsider',a:'Each night, picks a master. May only vote if the master is voting too.',n1:'They pick a master.',n:'They pick a master.'},
  Drunk:{t:'Outsider',fake:'Townsfolk',a:'Thinks they are a Townsfolk, but their ability does not work.'},
  Recluse:{t:'Outsider',a:'May register as evil, or as a Minion or Demon, even when dead.'},
  Saint:{t:'Outsider',a:'If executed, good loses the game.'},
  Poisoner:shared.Poisoner,
  Spy:{t:'Minion',a:'Each night, sees the Grimoire. May register as good, or as a Townsfolk or Outsider.',n1:'Show them the Grimoire tab.',n:'Show them the Grimoire tab.'},
  'Scarlet Woman':{t:'Minion',a:'If the Demon dies while five or more players live, becomes the Demon.',n:'If the Imp died today (5+ alive): tell them they are now the Imp.'},
  Baron:{t:'Minion',a:'Two extra Outsiders are in play.'},
  Imp:{t:'Demon',a:'Each night, kills one player. If they kill themselves, a Minion becomes the Imp.',n:'They pick a player. That player dies (unless protected/Soldier).'},
 },
 first:['Minion info','Demon info','Poisoner','Spy','Washerwoman','Librarian','Investigator','Chef','Empath','Fortune Teller','Butler'],
 other:['Poisoner','Monk','Spy','Scarlet Woman','Imp','Ravenkeeper','Undertaker','Empath','Fortune Teller','Butler'],
 setup:'Baron adds 2 Outsiders.',
 outsiderMod:r=>r.includes('Baron')?2:0
},
BMR:{name:'Bad Moon Rising',chars:{
  Grandmother:{t:'Townsfolk',a:'Starts knowing a good player and their character (the grandchild). If the Demon kills the grandchild, the Grandmother dies too.',n1:'Show the grandchild and their character.',n:'If the Demon killed the grandchild tonight, the Grandmother dies too.'},
  Sailor:{t:'Townsfolk',pick:'drunk',a:'Each night, picks a living player. Either the Sailor or that player is drunk until dusk. Cannot die while sober.',n1:'They pick a player. Choose who is drunk.',n:'They pick a player. Choose who is drunk.'},
  Chambermaid:{t:'Townsfolk',a:'Each night, picks two living players and learns how many of them woke tonight to use their ability.',n1:'They pick two. Show how many woke tonight.',n:'They pick two. Show how many woke tonight.'},
  Exorcist:{t:'Townsfolk',a:'Each night after the first, picks a player (not the same as last night). If it is the Demon, the Demon learns who the Exorcist is and does not act tonight.',n:'They pick a player. If Demon: wake the Demon, show the Exorcist, skip the Demon tonight.'},
  Innkeeper:{t:'Townsfolk',a:'Each night after the first, picks two players. Neither can die tonight, but one of them is drunk until dusk.',n:'They pick two. Mark both safe, one drunk.'},
  Gambler:{t:'Townsfolk',a:'Each night after the first, picks a player and guesses their character. A wrong guess kills the Gambler.',n:'They pick a player and a character. Wrong guess: Gambler dies.'},
  Gossip:{t:'Townsfolk',a:'Each day, may make a public statement. If it is true, a player dies tonight.',n:'If today\'s statement was true: choose a player to die.'},
  Courtier:{t:'Townsfolk',a:'Once per game at night, names a character. That player is drunk for three days and nights.',n1:'If used: they name a character. Mark drunk for 3 days.',n:'If used: they name a character. Mark drunk for 3 days.'},
  Professor:{t:'Townsfolk',a:'Once per game at night after the first, picks a dead player. If they are a Townsfolk, they come back to life.',n:'If used: they pick a dead player. Townsfolk returns to life.'},
  Minstrel:{t:'Townsfolk',a:'When a Minion dies by execution, everyone else is drunk until dusk tomorrow.'},
  'Tea Lady':{t:'Townsfolk',a:'Both living neighbours cannot die as long as both are good.'},
  Pacifist:{t:'Townsfolk',a:'Executed good players might not die.'},
  Fool:{t:'Townsfolk',a:'The first time they would die, they do not.'},
  Goon:{t:'Outsider',a:'Each night, the first player to target them with an ability is drunk until dusk, and the Goon takes that player\'s alignment.',n1:'First player to pick the Goon is drunk; Goon switches to their alignment.',n:'First player to pick the Goon is drunk; Goon switches to their alignment.'},
  Lunatic:shared.Lunatic,
  Tinker:{t:'Outsider',a:'May die at any time, for no reason.',n:'You may kill the Tinker.'},
  Moonchild:{t:'Outsider',a:'When they learn they have died, they publicly pick a living player. If that player is good, they die tonight.',n:'If the Moonchild chose a good player today, that player dies.'},
  Godfather:{t:'Minion',a:'Starts knowing which Outsiders are in play. If an Outsider dies during the day, picks a player to kill that night. One extra or one fewer Outsider is in play.',n1:'Show the Outsider characters in play.',n:'If an Outsider died today: they pick a player, who dies.'},
  "Devil's Advocate":{t:'Minion',pick:'safe',a:'Each night, picks a living player (not the same as last night). If that player is executed tomorrow, they do not die.',n1:'They pick a player. Mark safe from execution.',n:'They pick a player. Mark safe from execution.'},
  Assassin:{t:'Minion',a:'Once per game at night after the first, picks a player. They die, even if protected.',n:'If used: they pick a player, who dies no matter what.'},
  Mastermind:{t:'Minion',a:'If the Demon dies by execution, the game continues for one more day. If a player is executed that day, evil wins.'},
  Zombuul:{t:'Demon',a:'Each night after the first, if nobody died today, picks a player who dies. The first time the Zombuul dies, it survives but looks dead.',n:'Only if nobody died today: they pick a player, who dies.'},
  Pukka:{t:'Demon',pick:'poison',a:'Each night, picks a player who becomes poisoned. The player poisoned the night before dies, then becomes healthy.',n1:'They pick a player. Mark poisoned.',n:'They pick a player. Mark poisoned. Yesterday\'s poisoned player dies.'},
  Shabaloth:{t:'Demon',a:'Each night after the first, picks two players who die. A player killed the night before may be spat back to life.',n:'They pick two, who die. You may revive one of last night\'s victims.'},
  Po:{t:'Demon',a:'Each night after the first, may pick a player who dies. If they chose nobody last night, they pick three players tonight instead.',n:'They pick one player (or nobody). If they chose nobody last night: three players.'},
 },
 first:['Minion info','Lunatic','Demon info','Sailor','Courtier','Godfather',"Devil's Advocate",'Pukka','Grandmother','Chambermaid','Goon'],
 other:['Sailor','Innkeeper','Courtier','Gambler',"Devil's Advocate",'Exorcist','Lunatic','Zombuul','Pukka','Shabaloth','Po','Assassin','Godfather','Gossip','Tinker','Moonchild','Grandmother','Professor','Chambermaid','Goon'],
 setup:'Godfather adds or removes 1 Outsider.',
 outsiderMod:r=>r.includes('Godfather')?(Math.random()<.5?1:-1):0
},
UTT:{name:'Unholier Than Thou',chars:{
  Chef:shared.Chef,
  Noble:{t:'Townsfolk',a:'Starts knowing three players; exactly one of them is evil.',n1:'Point to the three chosen players (one evil, two good).'},
  Librarian:shared.Librarian,
  'Bounty Hunter':{t:'Townsfolk',a:'Starts knowing one evil player. When that player dies, learns another evil player that night. One Townsfolk in the game is secretly evil.',n1:'Point to the known evil player.',n:'If the known player died today or tonight: point to a new evil player.'},
  Balloonist:{t:'Townsfolk',a:'Each night, learns a player whose character type differs from the one learned the night before. May add one Outsider to the game.',n1:'Point to any player.',n:'Point to a player of a different character type than last time.'},
  'Snake Charmer':{t:'Townsfolk',a:'Each night, picks a living player. If it is the Demon, they swap characters and alignments, and the new Snake Charmer is poisoned.',n1:'They pick a player. If Demon: swap the two roles here, poison the new Snake Charmer.',n:'They pick a player. If Demon: swap the two roles here, poison the new Snake Charmer.'},
  Dreamer:{t:'Townsfolk',a:'Each night, picks a player (not themselves). Learns one good and one evil character; one of them is correct.',n1:'They pick a player. Show one good and one evil character.',n:'They pick a player. Show one good and one evil character.'},
  'Town Crier':{t:'Townsfolk',a:'Each night after the first, learns whether a Minion made a nomination today.',n:'Nod or shake your head.'},
  Savant:{t:'Townsfolk',a:'Each day, may visit the Storyteller privately for two statements: one true, one false.'},
  Nightwatchman:{t:'Townsfolk',a:'Once per game at night, picks a player. That player learns who the Nightwatchman is.',n1:'If used: wake the chosen player and point to the Nightwatchman.',n:'If used: wake the chosen player and point to the Nightwatchman.'},
  Seamstress:{t:'Townsfolk',a:'Once per game at night, picks two other players. Learns whether they are on the same team.',n1:'If used: they pick two. Nod or shake.',n:'If used: they pick two. Nod or shake.'},
  Amnesiac:{t:'Townsfolk',a:'Does not know their own ability. Each day may privately guess it and learns how close the guess is.',n1:'Run the secret ability you gave them, if it acts at night.',n:'Run the secret ability you gave them, if it acts at night.'},
  Magician:{t:'Townsfolk',a:'The Demon believes they are a Minion; the Minions believe they are the Demon.',n1:'Handled in Minion info and Demon info.'},
  Lunatic:shared.Lunatic,
  Mutant:{t:'Outsider',a:'If they are "mad" that they are an Outsider, they may be executed.'},
  Politician:{t:'Outsider',a:'If they were the player most responsible for their team losing, they switch sides and win, even if dead.'},
  Damsel:{t:'Outsider',a:'Every Minion knows a Damsel is in play. If a Minion publicly guesses who it is (one guess total), good loses.'},
  Poisoner:shared.Poisoner,
  Cerenovus:{t:'Minion',pick:'mad',a:'Each night, picks a player and a good character. That player must act "mad" that they are that character tomorrow, or may be executed.',n1:'They pick a player and a character. Wake the target, show the character. Mark mad.',n:'They pick a player and a character. Wake the target, show the character. Mark mad.'},
  Marionette:{t:'Minion',fake:'Good',a:'Thinks they are a good character but is actually evil. Sits next to the Demon, who knows who they are.',n1:'Wake the Demon and point to the Marionette (skip this if the Magician is alive).'},
  Goblin:{t:'Minion',a:'If they publicly claim to be the Goblin when nominated and are executed that day, evil wins.'},
  Leviathan:{t:'Demon',a:'Never kills. Everyone knows it is in play. If more than one good player is executed, evil wins. After day 5, evil wins.',n1:'At dawn: announce "The Leviathan is in play." Day 1 starts.',n:'At dawn: announce it again. Check the day counter.'},
 },
 first:['Minion info','Lunatic','Demon info','Marionette','Poisoner','Snake Charmer','Cerenovus','Amnesiac','Librarian','Chef','Dreamer','Seamstress','Noble','Balloonist','Bounty Hunter','Nightwatchman','Leviathan'],
 other:['Poisoner','Snake Charmer','Cerenovus','Lunatic','Amnesiac','Dreamer','Town Crier','Seamstress','Balloonist','Bounty Hunter','Nightwatchman','Leviathan'],
 setup:'Bounty Hunter makes one Townsfolk evil. Balloonist may add 1 Outsider.',
 outsiderMod:r=>r.includes('Balloonist')&&Math.random()<.5?1:0,
 jinx:['Magician + Marionette: while the Magician is alive, the Demon is not told who the Marionette is.','Cerenovus + Goblin: the Cerenovus may make a player mad that they are the Goblin.','Marionette + Balloonist: if the Marionette thinks they are the Balloonist, an Outsider might have been added.']
}};
const COMP={5:[3,0,1,1],6:[3,1,1,1],7:[5,0,1,1],8:[5,1,1,1],9:[5,2,1,1],10:[7,0,2,1],11:[7,1,2,1],12:[7,2,2,1],13:[9,0,3,1],14:[9,1,3,1],15:[9,2,3,1]};
const MARKS={poison:'Poisoned',drunk:'Drunk',safe:'Protected',mad:'Mad'};

let S=SCRIPTS.TB,C=S.chars,P=[],phase=0,done={};
const byType=t=>Object.keys(C).filter(k=>C[k].t===t);
const roleEvil=r=>!!C[r]&&['Minion','Demon'].includes(C[r].t);
const isEvil=p=>p.evil!=null?p.evil:roleEvil(p.role);
const shownRole=p=>p.fakeAs||p.role;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const blank=()=>({name:'',role:'',fakeAs:null,evil:null,dead:false,executed:false,ghost:true,poison:false,drunk:false,safe:false,mad:false,note:''});

function setScript(id){S=SCRIPTS[id];C=S.chars;P.forEach(p=>Object.assign(p,blank(),{name:p.name}));phase=0;done={};buildSetup();renderAll()}

// ---------- setup ----------
const countSel=document.getElementById('count');
for(let i=5;i<=15;i++){const o=document.createElement('option');o.value=i;o.textContent=i;countSel.append(o)}
countSel.value=8;countSel.onchange=buildSetup;
function buildSetup(){
  const n=+countSel.value,[t,o,m,d]=COMP[n];
  document.getElementById('comp').innerHTML=`<b>${t}</b> Townsfolk, <b>${o}</b> Outsider${o!=1?'s':''}, <b>${m}</b> Minion${m>1?'s':''}, <b>${d}</b> Demon. ${S.setup}`;
  while(P.length<n)P.push(blank());P.length=n;
  const box=document.getElementById('names');box.innerHTML='';
  P.forEach((p,i)=>{
    const opts=['<option value="">– role –</option>'].concat(['Townsfolk','Outsider','Minion','Demon'].map(g=>`<optgroup label="${g}">${byType(g).map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</optgroup>`));
    box.insertAdjacentHTML('beforeend',`<div class="row"><input type="text" placeholder="Player ${i+1}" value="${p.name}" oninput="P[${i}].name=this.value"><select onchange="P[${i}].role=this.value;P[${i}].fakeAs=null">${opts.join('')}</select></div>`);
  });
  document.getElementById('sheet').innerHTML='<h3>Character sheet</h3>'+['Townsfolk','Outsider','Minion','Demon'].map(g=>`<h3>${g}</h3>`+byType(g).map(r=>`<div><b>${r}</b><div class="role">${C[r].a}</div></div>`).join('')).join('');
}
function randomise(){
  const n=P.length;let [t,o,m,d]=COMP[n];
  const mins=shuffle(byType('Minion')).slice(0,m);
  const tfAll=shuffle(byType('Townsfolk'));
  const mod=S.outsiderMod([...mins,...tfAll.slice(0,t)]);const o2=Math.max(0,o+mod);t-=(o2-o);o=o2;
  const roles=shuffle([...tfAll.slice(0,t),...shuffle(byType('Outsider')).slice(0,o),...mins,...shuffle(byType('Demon')).slice(0,d)]);
  P.forEach((p,i)=>Object.assign(p,blank(),{name:p.name,role:roles[i]}));
  // Marionette must sit next to the Demon
  const mi=P.findIndex(p=>p.role==='Marionette'),di=P.findIndex(p=>C[p.role].t==='Demon');
  if(mi>-1&&di>-1&&Math.min((mi-di+n)%n,(di-mi+n)%n)!==1){const ni=(di+1)%n;[P[mi].role,P[ni].role]=[P[ni].role,P[mi].role]}
  // Bounty Hunter: one Townsfolk is evil
  if(P.some(p=>p.role==='Bounty Hunter')){const cand=shuffle(P.filter(p=>C[p.role].t==='Townsfolk'&&p.role!=='Bounty Hunter'));if(cand[0])cand[0].evil=true}
  assignFakes();buildSetup();
}
function assignFakes(){
  const inPlay=P.map(p=>p.role);
  P.forEach(p=>{const f=C[p.role]&&C[p.role].fake;if(!f||p.fakeAs)return;
    const pool=f==='Demon'?byType('Demon'):f==='Townsfolk'?byType('Townsfolk').filter(r=>!inPlay.includes(r)):[...byType('Townsfolk'),...byType('Outsider')].filter(r=>!inPlay.includes(r));
    p.fakeAs=shuffle(pool)[0]});
}
function startGame(){
  if(P.some(p=>!p.role)){alert('Every player needs a role.');return}
  P.forEach((p,i)=>{p.name=p.name.trim()||`Player ${i+1}`;Object.assign(p,{dead:false,executed:false,ghost:true,poison:false,drunk:false,safe:false,mad:false,note:''})});
  assignFakes();phase=0;done={};renderAll();tab('reveal');
}

// ---------- phases ----------
const phaseName=()=>phase===0?'Setup done':phase%2?`Night ${(phase+1)/2}`:`Day ${phase/2}`;
function nextPhase(){
  phase++;done={};
  if(phase%2){ // dusk: nightly marks expire, Poisoner/Monk etc. set new ones tonight
    P.forEach(p=>{p.safe=false;p.mad=false;if(S!==SCRIPTS.BMR){p.poison=false;p.drunk=false}});
  }
  renderAll();tab(phase%2?'night':'grim');
}

// ---------- grimoire ----------
function renderGrim(){
  if(!P.every(p=>C[p.role])){document.getElementById('grimList').innerHTML='<div class="empty">Start a game first.</div>';document.getElementById('tracker').innerHTML='';document.getElementById('notInPlay').innerHTML='';document.getElementById('counts').textContent='';return}
  document.getElementById('phase').textContent=phaseName();
  document.getElementById('phaseBtn').textContent=phase===0?'Begin first night':phase%2?'Dawn — start the day':'Dusk — start the night';
  const alive=P.filter(p=>!p.dead).length,evil=P.filter(p=>!p.dead&&isEvil(p)).length;
  document.getElementById('counts').textContent=`${alive} alive · ${evil} evil alive · ${P.length-alive} dead`;
  const lev=P.some(p=>p.role==='Leviathan'),gx=P.filter(p=>p.executed&&!isEvil(p)).length,day=Math.floor(phase/2);
  document.getElementById('tracker').innerHTML=lev?`<div class="card ${gx>1||day>5?'warn':''}"><b>Leviathan</b> — good players executed: <b>${gx}</b> of 1 allowed · day <b>${day}</b> of 5${gx>1?' — <b>evil wins</b>':day>5?' — <b>evil wins</b>':''}</div>`:'';
  document.getElementById('grimList').innerHTML=P.map((p,i)=>`
    <div class="card ${p.dead?'dead':''}">
      <div class="name">${p.name}</div>
      <div class="role ${isEvil(p)?'evil':'good'}">${p.role}${p.fakeAs?` (thinks: ${p.fakeAs})`:''}${p.evil!=null?' (turned evil)':''} · ${C[p.role].t}</div>
      <div class="chips">
        <button class="chip ${p.dead?'on bad':''}" onclick="P[${i}].dead=!P[${i}].dead;if(!P[${i}].dead)P[${i}].executed=false;renderAll()">${p.dead?'Dead':'Alive'}</button>
        <button class="chip ${p.executed?'on bad':''}" onclick="P[${i}].executed=!P[${i}].executed;if(P[${i}].executed)P[${i}].dead=true;renderAll()">Executed</button>
        ${p.dead?`<button class="chip ${p.ghost?'on':''}" onclick="P[${i}].ghost=!P[${i}].ghost;renderGrim()">${p.ghost?'Ghost vote left':'Ghost vote used'}</button>`:''}
        ${Object.keys(MARKS).map(k=>`<button class="chip ${p[k]?'on bad':''}" onclick="P[${i}].${k}=!P[${i}].${k};renderAll()">${MARKS[k]}</button>`).join('')}
      </div>
      <input class="note" type="text" placeholder="Reminder (red herring, mad as…, known player…)" value="${p.note.replace(/"/g,'&quot;')}" oninput="P[${i}].note=this.value">
    </div>`).join('');
  const inPlay=P.map(p=>p.role),nip=[...byType('Townsfolk'),...byType('Outsider')].filter(r=>!inPlay.includes(r));
  document.getElementById('notInPlay').innerHTML=`<b>Not in play</b> (pick 3 Demon bluffs)<div class="role">${nip.join(', ')}</div>`;
}

// ---------- night ----------
function setMark(kind,idx){P.forEach(p=>p[kind]=false);if(idx!==''){P[+idx][kind]=true}renderGrim()}
function renderNight(){
  if(!P.every(p=>C[p.role])){document.getElementById('nightList').innerHTML='<div class="empty">Start a game first.</div>';return}
  const first=phase<=1,order=first?S.first:S.other;
  document.getElementById('dawnBtn').style.display=phase%2?'':'none';
  document.getElementById('nightTitle').textContent=phase===0?'First night order':first?'First night':`Night ${(phase+1)/2}`;
  const list=document.getElementById('nightList');
  list.className=document.getElementById('showAbsent').checked?'toggleAbsent':'';
  const flags=p=>(p.dead?' (dead)':'')+(p.poison?' (poisoned)':'')+(p.drunk?' (drunk)':'');
  const minions=P.filter(p=>C[p.role].t==='Minion'),mins=minions.map(p=>p.name).join(', ')||'none';
  const demon=P.find(p=>C[p.role].t==='Demon'),lunatic=P.find(p=>p.role==='Lunatic'),magician=P.find(p=>p.role==='Magician'),damsel=P.some(p=>p.role==='Damsel');
  list.innerHTML=order.map((r,i)=>{
    let who,hint,present=true,picker='';
    if(r==='Minion info'){present=P.length>=7;who=minions.filter(p=>p.role!=='Marionette').map(p=>p.name).join(', ')||'none';
      hint=`Minions open eyes; point to the Demon (${demon?demon.name:'?'}${magician?` and the Magician ${magician.name} — they can't tell which`:''}) and to each other. Marionette stays asleep.${damsel?' Show that a Damsel is in play.':''}`}
    else if(r==='Demon info'){present=P.length>=7;who=demon?demon.name+flags(demon):'?';
      hint=`Demon opens eyes; point to Minions (${minions.filter(p=>p.role!=='Marionette').map(p=>p.name).join(', ')||'none'}${magician?` and the Magician ${magician.name}`:''}). Show 3 bluffs.${lunatic?` Also point out the Lunatic (${lunatic.name}).`:''}`}
    else{
      const ps=P.filter(p=>p.role===r||p.fakeAs===r);present=ps.length>0;
      who=ps.map(p=>p.name+flags(p)+(p.fakeAs===r?` (really ${p.role})`:'')).join(', ')||'not in play';
      hint=(first?C[r].n1:C[r].n)||'';
      const k=C[r].pick;
      if(k&&ps.some(p=>!p.dead&&p.role===r)){const cur=P.findIndex(p=>p[k]);
        picker=`<select onchange="setMark('${k}',this.value)"><option value="">${MARKS[k]}: nobody</option>${P.map((p,j)=>`<option value="${j}" ${cur===j?'selected':''}>${MARKS[k]}: ${p.name}</option>`).join('')}</select>`}
    }
    return `<div class="step ${present?'':'absent'} ${done[i]?'done':''}"><input type="checkbox" ${done[i]?'checked':''} onchange="done[${i}]=this.checked;renderNight()">
      <div><div><b>${r}</b> — <span class="who">${who}</span></div><div class="hint">${hint}</div>${picker}</div></div>`;
  }).join('');
  const jx=document.getElementById('jinx');jx.style.display=S.jinx?'':'none';
  if(S.jinx)jx.innerHTML='<b>Djinn — special rules in this script</b>'+S.jinx.map(j=>`<div class="role">${j}</div>`).join('');
}

// ---------- reveal ----------
function renderReveal(){
  document.getElementById('revealList').innerHTML=P.length&&P.every(p=>p.role)?P.map((p,i)=>`<button class="btn" onclick="showCard(${i})">${p.name||'Player '+(i+1)}</button>`).join(''):'<div class="empty">Start a game first.</div>';
}
function showCard(i){
  const p=P[i],shown=shownRole(p),c=C[shown];
  const showEvil=p.fakeAs?roleEvil(shown):isEvil(p);
  document.getElementById('cName').textContent=p.name;
  document.getElementById('cRole').textContent=shown;
  document.getElementById('cTeam').textContent=`${c.t} · ${showEvil?'Evil':'Good'}`;
  document.getElementById('cTeam').style.color=showEvil?'var(--evil)':'var(--good)';
  document.getElementById('cAbil').textContent=c.a;
  let mates='';
  if(!p.fakeAs&&roleEvil(p.role)&&P.length>=7){
    const others=P.filter((q,j)=>j!==i&&roleEvil(q.role)&&q.role!=='Marionette');
    mates='Your team: '+others.map(q=>`${q.name} (${q.role})`).join(', ');
  }
  if(p.evil&&!roleEvil(p.role))mates='You are evil, but you do not know who the Demon is.';
  if(p.fakeAs&&C[p.role].fake==='Demon')mates='Your Minions will be shown to you tonight.';
  document.getElementById('cMates').textContent=mates;
  document.getElementById('curtain').classList.add('on');
}
function hideCard(){document.getElementById('curtain').classList.remove('on')}

// ---------- tabs ----------
function tab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===id));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick').includes(`'${id}'`)));
}
function renderAll(){renderGrim();renderNight();renderReveal()}
buildSetup();renderAll();
</script>
</body>
