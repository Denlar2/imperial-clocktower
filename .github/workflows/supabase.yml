name: Supabase schema

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/migrate.sh', '.github/workflows/supabase.yml']
  workflow_dispatch:
  schedule:
    # Weekly ping so the free-tier project is never paused for inactivity.
    - cron: '17 6 * * 1'

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Call a public RPC with the anon key (counts as activity, needs no secret)
        run: |
          curl -sSf -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/player_view" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{"p_code":"ping","p_id":"ping"}'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

  migrate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Protected environment: the owner must approve each run before the token is exposed to it.
    environment: supabase
    steps:
      - uses: actions/checkout@v4
      - run: scripts/migrate.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
